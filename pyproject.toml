[project]
name = "spatial-atlas"
version = "1.0.0"
description = "A2A research agent for compute-grounded spatial reasoning (CGR). It computes 2D scene-graph facts over model-estimated coordinates before generation and offers an opt-in hardened MLE-Bench path."
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/Apache-2.0.txt"]
authors = [{ name = "Arun Sharma" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "a2a-sdk[http-server]>=0.3.20",
    "httpx>=0.28.1",
    "litellm>=1.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.38.0",
    # Floor is a security minimum, not a preference. 6.16.0 fixes PYSEC-2026-3913 and 6.16.1
    # fixes PYSEC-2026-3910 and PYSEC-2026-3911. Pinning this in uv.lock alone is not enough,
    # because hatchling builds the wheel from this metadata, so a lock-less install could
    # resolve back onto vulnerable 6.15.0 and the audit only ever scans the exported lock.
    "pypdf>=6.16.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# BLE001 flags `except Exception`. The seventeen occurrences below were each read
# individually and are deliberate boundary catches whose job is to degrade rather than
# crash: optional model loading that sets `_available = False` and carries on, per-step
# vision degradation, the refinement retry loop, and the leak-detector registry, which
# must survive a malformed third-party detector. That registry already caused an outage
# by raising inside its own except clause. That outage argues for keeping
# those catches broad rather than narrowing them.
#
# Scoped per file rather than ignored project-wide on purpose. A blanket ignore would
# also exempt every module added later, and BLE001 turned out to be the only rule
# surfacing a real defect here: `except (json.JSONDecodeError, Exception)` in spatial.py
# and analyzer.py, which is exactly `except Exception` because JSONDecodeError subclasses
# ValueError subclasses Exception. B014 does not catch subclass redundancy. Both are now
# fixed. Keeping the rule live everywhere else preserves that signal for new code.
"src/entropy/engine.py" = ["BLE001"]
"src/executor.py" = ["BLE001"]
"src/fieldwork/detector.py" = ["BLE001"]
"src/fieldwork/perception.py" = ["BLE001"]
"src/fieldwork/spatial.py" = ["BLE001"]
"src/fieldwork/vision.py" = ["BLE001"]
"src/mlebench/analyzer.py" = ["BLE001"]
"src/mlebench/executor.py" = ["BLE001"]
"src/mlebench/handler.py" = ["BLE001"]
"src/mlebench/strategies/leaks.py" = ["BLE001"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-m 'not e2e and not gpu' -ra"
# Collect only the tests directory.
testpaths = ["tests"]
markers = [
    "unit: fast hermetic unit tests (no network/GPU)",
    "integration: local-fixture integration tests",
    "smoke: wiring/import smoke tests",
    "e2e: end-to-end, requires GPU tool server + dataset",
    "gpu: requires a GPU / GPU tool server",
    "slow: long-running",
]
